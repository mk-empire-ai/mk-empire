<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MK EMPIRE - DEALER</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#FFD700;font-family:Arial;min-height:100vh}.container{max-width:480px;margin:0 auto;padding:12px}.header{background:linear-gradient(145deg,#0a0a0a,#1e1e1e);border:2px solid #FFD700;border-radius:22px;padding:20px;text-align:center;box-shadow:0 0 40px rgba(255,215,0,0.4)}.logo{width:140px;height:140px;border-radius:50%;border:3px solid #FFD700;box-shadow:0 0 30px #FFD700;object-fit:cover}.title{font-size:28px;font-weight:900;margin:10px 0 4px;letter-spacing:3px;text-shadow:0 0 10px #FFD700}.mtn{background:linear-gradient(90deg,#FFD700,#ffcc00);color:#000;padding:14px;border-radius:14px;font-weight:900;margin:12px 0;border:2px solid #fff;box-shadow:0 0 25px #FFD700;text-align:center}.card{background:linear-gradient(145deg,#151515,#222);border:1.5px solid #FFD700;border-radius:16px;padding:16px;margin:10px 0}input{width:100%;padding:14px;border-radius:12px;border:2px solid #333;background:#000;color:#FFD700;font-size:18px;margin:8px 0;text-align:center}button{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(90deg,#FFD700,#ffaa00);color:#000;font-weight:900;font-size:16px;margin:6px 0}.ok{background:#00ff0033;border:2px solid #0f0;color:#0f0;padding:20px;border-radius:14px;text-align:center;font-weight:900}.bad{background:#ff000033;border:2px solid #f00;color:#ff6666;padding:15px;border-radius:14px;text-align:center}.wa{background:linear-gradient(90deg,#25D366,#128C7E);color:#fff}
</style></head><body>
<div class="container"><div class="header">
<img src="https://i.ibb.co/5g0r6L2P/mk-logo.jpg" class="logo">
<div class="title">👑 MK EMPIRE 👑</div><div style="color:#888;font-size:11px;letter-spacing:2px">ROYAL EMPIRE • DEALER ACCESS</div>
<div class="mtn">PAY MTN MoMo: 0784244722<br><small>Mukisa - Manual Approval</small></div></div>
<div class="card"><h3 style="text-align:center">🔍 CHECK ACCESS</h3>
<input id="num" placeholder="07XXXXXXXX" maxlength="10">
<input id="code" placeholder="Enter Secret Code (from Boss)">
<button onclick="check()">✅ VERIFY MY ACCESS</button><div id="res" style="margin-top:12px"></div></div>
<div class="card"><h3>📩 NOT APPROVED?</h3><p style="color:#ccc;font-size:13px;line-height:1.6">1. Pay MTN <b style="color:#FFD700">0784244722</b><br>2. Send proof to Boss<br>3. Boss sends SECRET CODE<br>4. Enter number + code → APPROVED!<br><br><b>Manual System - Boss Mukisa Approves!</b></p>
<button onclick="window.open('https://wa.me/256784244722?text=Hi Boss Mukisa, I paid MK EMPIRE - My number: '+document.getElementById('num').value,'_blank')" class="wa">💬 SEND PROOF TO MUKISA</button></div></div>
<script>
function check(){let n=document.getElementById('num').value.trim();let c=document.getElementById('code').value.trim().toUpperCase();if(n.length<10){document.getElementById('res').innerHTML='<div class=bad>Enter 07 number</div>';return;}let db=JSON.parse(localStorage.getItem('mkDealersV2')||'{}');if(db[n]){document.getElementById('res').innerHTML='<div class=ok>🎉 WELCOME '+db[n].name+'! ✅<br>NUMBER: '+n+'<br>CODE: '+db[n].code+'<br><br>👑 YOU ARE MK EMPIRE DEALER!</div>';return;}if(!c){document.getElementById('res').innerHTML='<div class=bad>❌ Enter Secret Code from Boss!</div>';return;}if(c.length>=4 && c.startsWith('MK')){db[n]={name:'Dealer',code:c,date:new Date().toLocaleString()};localStorage.setItem('mkDealersV2',JSON.stringify(db));document.getElementById('res').innerHTML='<div class=ok>🎉 APPROVED! ✅<br>NUMBER: '+n+'<br>CODE: '+c+'<br><br>👑 WELCOME!</div>';} else {document.getElementById('res').innerHTML='<div class=bad>❌ Wrong Code! Ask Boss for MK- code</div>';}}
</script></body></html>
