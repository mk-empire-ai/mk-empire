<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK EMPIRE - BOSS</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:10px;background:#000;color:#FFD700;font-family:Arial}
.container{max-width:500px;margin:0 auto}
.header{background:#111;border:3px solid gold;border-radius:20px;padding:25px;text-align:center;box-shadow:0 0 30px gold}
.biglogo{width:140px;height:140px;margin:0 auto;background:gold;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:70px;font-weight:900;border:4px solid #fff;box-shadow:0 0 25px gold}
.title{font-size:32px;font-weight:900;margin:15px 0 5px;color:gold;text-shadow:0 0 10px gold}
.mtn{background:gold;color:#000;padding:15px;border-radius:12px;font-weight:900;margin:15px 0;text-align:center;border:2px solid white}
.card{background:#1a1a1a;border:2px solid gold;border-radius:15px;padding:18px;margin:12px 0}
input{width:100%;padding:14px;border-radius:10px;border:2px solid #333;background:#000;color:gold;margin:8px 0;font-size:16px}
button{width:100%;padding:14px;border-radius:10px;border:none;background:gold;color:#000;font-weight:900;margin:6px 0;font-size:17px}
.codebox{background:gold;color:#000;padding:12px;border-radius:8px;font-weight:900;text-align:center;font-size:22px;margin:10px 0}
.dealer{background:#000;border:1px solid gold;border-radius:10px;padding:10px;margin:8px 0}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="biglogo">MK</div>
<div class="title">👑 MK EMPIRE 👑</div>
<div style="color:#888;font-size:11px;letter-spacing:4px">ROYAL EMPIRE - BOSS</div>
<div class="mtn">
💰 MTN MoMo: 0784244722 - MUKISA<br>
🌍 WorldRemit → 0784244722<br>
Instant Worldwide!
</div>
</div>

<div class="card">
<h3 style="color:gold;text-align:center">🔐 BOSS LOGIN - CLICK TO ENTER</h3>
<input type="password" id="pass" placeholder="Type anything">
<button onclick="login()">LOGIN AS BOSS</button>
<div id="msg"></div>
</div>

<div id="panel" style="display:none">
<div class="card">
<h3>➕ APPROVE DEALER</h3>
<input id="dNum" placeholder="07XXXXXXXX">
<input id="dName" placeholder="Dealer Name - e.g. John">
<button onclick="approve()">✅ GENERATE CODE</button>
<div id="gen"></div>
</div>
<div class="card">
<h3>📋 APPROVED: <span id="count">0</span></h3>
<div id="list">No dealers yet</div>
</div>
</div>
</div>

<script>
function login(){
  document.getElementById('panel').style.display='block';
  document.getElementById('msg').innerHTML='<div style="background:#00ff0033;border:2px solid #0f0;color:#0f0;padding:12px;border-radius:10px;text-align:center;font-weight:900">✅ WELCOME BOSS MUKISA! SCROLL DOWN!</div>';
  load();
}
function approve(){
  var n=document.getElementById('dNum').value.trim();
  var name=document.getElementById('dName').value.trim();
  if(!name) name='Dealer';
  if(n.length<10){alert('Enter 07XXXXXXXX');return;}
  var code='MK-'+n.slice(-4)+Math.floor(Math.random()*90+10);
  var db=JSON.parse(localStorage.getItem('mkDealersV2')||'{}');
  db[n]={name:name,code:code,date:new Date().toLocaleString()};
  localStorage.setItem('mkDealersV2',JSON.stringify(db));
  document.getElementById('gen').innerHTML='<div class=dealer><b>'+n+' - '+name+'</b><div class=codebox>'+code+'</div><p style=color:#0f0>✅ COPY CODE → SEND TO DEALER ON WHATSAPP!</p></div>';
  document.getElementById('dNum').value='';
  load();
}
function load(){
  var db=JSON.parse(localStorage.getItem('mkDealersV2')||'{}');
  var html='';var c=0;
  for(var k in db){c++;html+='<div class=dealer><b>'+k+'</b> - '+db[k].name+'<br><div class=codebox>'+db[k].code+'</div><small>'+db[k].date+'</small></div>';}
  document.getElementById('list').innerHTML=html||'No dealers yet';
  document.getElementById('count').innerText=c;
}
</script>
</body>
</html>
