<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK EMPIRE - ADMIN ROYAL</title>
<style>
body{background:#000 url('logo.png') no-repeat center fixed;background-size:300px;margin:0;font-family:Arial;color:#ffd700}
.overlay{background:rgba(0,0,0,0.88);min-height:100vh;padding:15px}
.header{text-align:center;border:3px solid #ffd700;border-radius:20px;padding:15px;background:linear-gradient(145deg,#111,#000);box-shadow:0 0 30px #ffd700}
.logo{width:120px;height:120px;border-radius:50%;border:3px solid #ffd700;box-shadow:0 0 20px #ffd700}
h1{margin:10px 0;color:#ffd700;text-shadow:0 0 10px #ffd700;letter-spacing:3px}
.mtn-box{background:linear-gradient(90deg,#ffcc00,#ffd700);color:#000;padding:12px;border-radius:12px;font-weight:bold;margin:10px 0;font-size:18px;border:2px solid #fff}
.card{background:#111;border:2px solid #ffd700;border-radius:15px;padding:15px;margin:12px 0;box-shadow:0 0 15px rgba(255,215,0,0.3)}
input{width:92%;padding:12px;border-radius:10px;border:2px solid #ffd700;background:#000;color:#ffd700;margin:8px 0}
button{background:linear-gradient(90deg,#ffd700,#ffcc00);color:#000;border:none;padding:12px 20px;border-radius:10px;font-weight:bold;width:100%;margin:5px 0;cursor:pointer;box-shadow:0 0 10px #ffd700}
button:active{transform:scale(0.95)}
.pending{border-left:5px solid red}
.approved{border-left:5px solid #00ff00}
</style>
</head>
<body>
<div class="overlay">
<div class="header">
<img src="logo.png" class="logo" onerror="this.src='https://via.placeholder.com/120/000000/FFD700?text=MK'">
<h1>👑 MK EMPIRE 👑</h1>
<p>ROYAL EMPIRE • EST. MMXXIV</p>
<div class="mtn-box">💰 PAY MTN MoMo: 0784244722 - Mukisa<br>Send screenshot on WhatsApp after payment!</div>
</div>

<div class="card">
<h3>🔐 ADMIN LOGIN</h3>
<input type="password" id="adminPass" placeholder="Enter Admin Password">
<button onclick="login()">LOGIN AS BOSS</button>
<p id="loginMsg"></p>
</div>

<div id="adminPanel" style="display:none">
<div class="card">
<h3>➕ APPROVE DEALER</h3>
<input type="text" id="dealerNum" placeholder="Dealer Number 07XXXXXXXX">
<input type="text" id="dealerName" placeholder="Dealer Name">
<button onclick="approveDealer()">✅ APPROVE & ACTIVATE</button>
</div>

<div class="card">
<h3>📋 PENDING PAYMENTS</h3>
<div id="pendingList">No pending...</div>
</div>

<div class="card">
<h3>✅ APPROVED DEALERS</h3>
<div id="approvedList"></div>
</div>

<button onclick="clearAll()" style="background:linear-gradient(90deg,#ff0000,#cc0000);color:#fff">🗑️ CLEAR ALL DATA</button>
</div>

<script>
const BOSS_PASS = "mk2024";
function login(){
 if(document.getElementById('adminPass').value===BOSS_PASS){
  document.getElementById('adminPanel').style.display='block';
  document.getElementById('loginMsg').innerHTML="✅ Welcome Boss MK!";
  loadDealers();
 }else{
  document.getElementById('loginMsg').innerHTML="❌ Wrong Password!";
 }
}
function approveDealer(){
 let num=document.getElementById('dealerNum').value.trim();
 let name=document.getElementById('dealerName').value.trim();
 if(num.length<10){alert("Enter full 07 number!");return;}
 let dealers=JSON.parse(localStorage.getItem('mkDealers')||"{}");
 dealers[num]={name:name||"Dealer",approved:true,date:new Date().toLocaleString()};
 localStorage.setItem('mkDealers',JSON.stringify(dealers));
 alert("✅ "+num+" APPROVED!");
 document.getElementById('dealerNum').value="";
 loadDealers();
}
function loadDealers(){
 let dealers=JSON.parse(localStorage.getItem('mkDealers')||"{}");
 let html="";
 for(let num in dealers){
  html+=`<div class="card approved"><b>${num}</b> - ${dealers[num].name}<br><small>${dealers[num].date}</small><br><button onclick="removeDealer('${num}')">REMOVE</button></div>`;
 }
 document.getElementById('approvedList').innerHTML=html||"No approved dealers yet";
 let pending=JSON.parse(localStorage.getItem('mkPending')||"[]");
 let phtml="";
 pending.forEach((p,i)=>{
  phtml+=`<div class="card pending"><b>${p.num}</b> - ${p.name}<br><button onclick="approveFromPending('${p.num}','${p.name}',${i})">APPROVE THIS</button></div>`;
 });
 document.getElementById('pendingList').innerHTML=phtml||"No pending payments";
}
function removeDealer(num){
 let dealers=JSON.parse(localStorage.getItem('mkDealers')||"{}");
 delete dealers[num];
 localStorage.setItem('mkDealers',JSON.stringify(dealers));
 loadDealers();
}
function approveFromPending(num,name,index){
 let dealers=JSON.parse(localStorage.getItem('mkDealers')||"{}");
 dealers[num]={name:name,approved:true,date:new Date().toLocaleString()};
 localStorage.setItem('mkDealers',JSON.stringify(dealers));
 let pending=JSON.parse(localStorage.getItem('mkPending')||"[]");
 pending.splice(index,1);
 localStorage.setItem('mkPending',JSON.stringify(pending));
 loadDealers();
}
function clearAll(){
 if(confirm("Clear all dealers?")){
  localStorage.removeItem('mkDealers');
  localStorage.removeItem('mkPending');
  loadDealers();
 }
}
// Auto load if already logged
if(localStorage.getItem('mkAdmin')==='yes'){document.getElementById('adminPanel').style.display='block';loadDealers();}
</script>
</div>
</body>
</html>
