<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK EMPIRE - BOSS</title>
<style>
body{background:#000;color:#FFD700;font-family:Arial;margin:0;padding:12px}
.container{max-width:480px;margin:0 auto}
.header{background:#111;border:2px solid #FFD700;border-radius:20px;padding:20px;text-align:center;box-shadow:0 0 30px gold}
.logo{width:130px;height:130px;border-radius:50%;border:3px solid gold}
.title{font-size:28px;font-weight:900;margin:10px 0;text-shadow:0 0 10px gold}
.mtn{background:gold;color:#000;padding:12px;border-radius:12px;font-weight:900;margin:12px 0;text-align:center}
.card{background:#1a1a1a;border:1.5px solid gold;border-radius:15px;padding:15px;margin:12px 0}
input{width:100%;padding:13px;border-radius:10px;border:2px solid #333;background:#000;color:gold;margin:8px 0}
button{width:100%;padding:13px;border-radius:10px;border:none;background:gold;color:#000;font-weight:900;margin:6px 0}
.codebox{background:gold;color:#000;padding:12px;border-radius:8px;font-weight:900;text-align:center;font-size:22px;margin:10px 0}
.dealer{background:#000;border:1px solid gold;border-radius:10px;padding:10px;margin:8px 0}
</style>
</head>
<body>
<div class="container">
<div class="header">
<img src="logo.jpg" class="logo" onerror="this.style.background='#222'">
<div class="title">👑 MK EMPIRE 👑</div>
<div style="color:#888;font-size:11px">ROYAL EMPIRE - BOSS PANEL</div>
<div class="mtn">
💰 MTN MoMo: 0784244722<br>
🌍 WorldRemit → MTN 0784244722<br>
<small>Mukisa - Worldwide</small>
</div>
</div>

<div class="card">
<h3>🔐 BOSS LOGIN</h3>
<input type="password" id="pass" placeholder="Password">
<button onclick="login()">LOGIN</button>
<div id="msg"></div>
<p style="font-size:11px;color:#777;text-align:center">mk2024 / mk-empire-ai / 0784244722</p>
</div>

<div id="panel" style="display:none">
<div class="card">
<h3>➕ APPROVE DEALER</h3>
<input id="dNum" placeholder="07XXXXXXXX">
<input id="dName" placeholder="Dealer Name">
<button onclick="approve()">✅ GENERATE CODE</button>
<div id="gen"></div>
</div>
<div class="card">
<h3>📋 APPROVED: <span id="count">0</span></h3>
<div id="list">No dealers yet</div>
</div>
</div>
</div>

<script>
function login(){
  var p=document.getElementById('pass').value.trim().toLowerCase();
  var ok=["mk2024","mk-empire-ai","0784244722","mk","admin"];
  if(ok.indexOf(p)>=0){
    document.getElementById('panel').style.display='block';
    document.getElementById('msg').innerHTML='<div style="color:#0f0;text-align:center">✅ Welcome Boss!</div>';
    load();
  }else{
    document.getElementById('msg').innerHTML='<div style="color:#f55;text-align:center">❌ Wrong!</div>';
  }
}
function approve(){
  var n=document.getElementById('dNum').value.trim();
  var name=document.getElementById('dName').value.trim();
  if(!name) name='Dealer';
  if(n.length<10){alert('Enter 07 number');return;}
  var code='MK-'+n.slice(-4)+Math.floor(Math.random()*90+10);
  var db=JSON.parse(localStorage.getItem('mkDealersV2')||'{}');
  db[n]={name:name,code:code,date:new Date().toLocaleString()};
  localStorage.setItem('mkDealersV2',JSON.stringify(db));
  document.getElementById('gen').innerHTML='<div class=dealer><b>'+n+' - '+name+'</b><div class=codebox>'+code+'</div><p style=color:#0f0>✅ Send CODE to dealer on WhatsApp!</p></div>';
  document.getElementById('dNum').value='';
  load();
}
function load(){
  var db=JSON.parse(localStorage.getItem('mkDealersV2')||'{}');
  var html='';var c=0;
  for(var k in db){
    c++;
    html+='<div class=dealer><b>'+k+'</b> - '+db[k].name+'<br><div class=codebox>'+db[k].code+'</div><small>'+db[k].date+'</small></div>';
  }
  document.getElementById('list').innerHTML=html||'No dealers yet';
  document.getElementById('count').innerText=c;
}
</script>
</body>
</html>
