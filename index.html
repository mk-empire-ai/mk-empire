<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK EMPIRE - BOSS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at top, #2a2300 0%, #000 70%);color:#FFD700;font-family:Arial;min-height:100vh}
.container{max-width:480px;margin:0 auto;padding:12px}
.header{background:linear-gradient(145deg, #0f0f0f, #1f1f1f);border:2px solid #FFD700;border-radius:22px;padding:20px;text-align:center;box-shadow:0 0 40px rgba(255,215,0,0.4)}
.logo-circle{width:140px;height:140px;margin:0 auto;background:radial-gradient(circle, #222 0%, #000 100%);border:3px solid #FFD700;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px #FFD700;position:relative}
.logo-circle::before{content:'👑';position:absolute;top:-18px;font-size:32px}
.mk-text{font-size:52px;font-weight:900;color:#FFD700;text-shadow:0 0 15px #FFD700;letter-spacing:4px}
.empire-text{font-size:13px;letter-spacing:6px;color:#ffcc00}
.title{font-size:26px;font-weight:900;margin:12px 0 4px;letter-spacing:3px}
.mtn{background:linear-gradient(90deg, #FFD700, #ffcc00);color:#000;padding:14px;border-radius:14px;font-weight:900;margin:12px 0;border:2px solid #fff;box-shadow:0 0 25px #FFD700;text-align:center}
.card{background:linear-gradient(145deg, #151515, #222);border:1.5px solid #FFD700;border-radius:16px;padding:16px;margin:10px 0}
input{width:100%;padding:14px;border-radius:12px;border:2px solid #333;background:#000;color:#FFD700;font-size:16px;margin:8px 0}
button{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(90deg, #FFD700, #ffaa00);color:#000;font-weight:900;font-size:16px;margin:6px 0}
.msg{padding:10px;border-radius:10px;margin-top:8px;text-align:center;font-weight:bold}
.ok{background:#00ff0033;border:1px solid #0f0;color:#0f0}
.bad{background:#ff000033;border:1px solid #f00;color:#ff6666}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="logo-circle"><div><div class="mk-text">MK</div><div class="empire-text">EMPIRE</div></div></div>
<div class="title">👑 MK EMPIRE 👑</div>
<div style="color:#888;font-size:11px;letter-spacing:2px">ROYAL EMPIRE • EST. MMXXIV</div>
<div class="mtn">💰 MTN MoMo: 0784244722<br><small>Mukisa - Send Proof on WhatsApp</small></div>
</div>

<div class="card">
<h3>🔐 BOSS LOGIN</h3>
<input type="password" id="pass" placeholder="Enter password">
<button onclick="doLogin()">LOGIN AS BOSS</button>
<div id="loginMsg"></div>
<p style="font-size:11px;color:#777;text-align:center;margin-top:8px">Password: mk2024<br>Also works: mk-empire-ai or 0784244722 or mk</p>
</div>

<div id="panel" style="display:none">
<div class="card">
<h3>➕ APPROVE DEALER</h3>
<input id="dNum" placeholder="07XXXXXXXX">
<input id="dName" placeholder="Dealer Name">
<button onclick="approve()">✅ APPROVE NOW</button>
</div>
<div class="card">
<h3>📋 APPROVED: <span id="count">0</span></h3>
<div id="list"></div>
</div>
</div>
</div>
<script>
function doLogin(){
 let p=document.getElementById('pass').value.trim().toLowerCase();
 let ok=["mk2024","mk-empire-ai","0784244722","mk","admin","mk empire","mkmk"];
 if(ok.includes(p)){
  document.getElementById('panel').style.display='block';
  document.getElementById('loginMsg').innerHTML='<div class="msg ok">✅ Welcome Boss! Scroll Down!</div>';
  localStorage.setItem('mkAdmin','yes'); load();
 }else{
  document.getElementById('loginMsg').innerHTML='<div class="msg bad">❌ Wrong! Use: mk2024</div>';
 }
}
function approve(){
 let n=document.getElementById('dNum').value.trim();
 let name=document.getElementById('dName').value.trim()||'Dealer';
 if(n.length<10){alert('Enter full number');return;}
 let db=JSON.parse(localStorage.getItem('mkDealers')||'{}');
 db[n]={name:name,date:new Date().toLocaleString()};
 localStorage.setItem('mkDealers',JSON.stringify(db));
 document.getElementById('dNum').value=''; load(); alert('✅ '+n+' APPROVED!');
}
function load(){
 let db=JSON.parse(localStorage.getItem('mkDealers')||'{}');
 let html=''; let c=0;
 for(let k in db){c++; html+=`<div style="background:#000;border:1px solid #FFD700;border-radius:10px;padding:10px;margin:6px 0;display:flex;justify-content:space-between"><div><b>${k}</b><br><small>${db[k].name}</small></div><button onclick="let db=JSON.parse(localStorage.getItem('mkDealers')||'{}');delete db['${k}'];localStorage.setItem('mkDealers',JSON.stringify(db));location.reload()" style="width:auto;padding:5px 10px;background:#f00;color:#fff">X</button></div>`;}
 document.getElementById('list').innerHTML=html||'No dealers';
 document.getElementById('count').innerText=c;
}
if(localStorage.getItem('mkAdmin')==='yes'){document.getElementById('panel').style.display='block';load();}
</script>
</body>
</html>
